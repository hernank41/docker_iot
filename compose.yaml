services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DB}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_USER_PASS}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./mariadb:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    user: "1000:1000"
    environment:
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - "1883:1883"
      - "${PUERTO_MQTTS}:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  clientemqtt:
    build:
      context: ./clienteMqtt
    image: clientemqtt_industrial
    container_name: clientemqtt
    environment:
      - SERVIDOR=${SERVIDOR}
      - PUERTO_MQTTS=${PUERTO_MQTTS}
      - PUERTO_MQTT=${PUERTO_MQTT}
      - TOPICO=${TOPICO}
      - MARIADB_SERVER=${MARIADB_SERVER}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_USER_PASS=${MARIADB_USER_PASS}
      - MARIADB_DB=${MARIADB_DB}
      - MQTT_USR=${MQTT_USR}
      - MQTT_PASS=${MQTT_PASS}
      - API_URL=${API_URL}
    depends_on:
      - mariadb
      - mosquitto
      - apiiot
    restart: unless-stopped

  apiiot:
    build:
      context: ./apiiot
    image: apiiot_industrial
    container_name: apiiot_industrial
    environment:
      - MARIADB_SERVER=${MARIADB_SERVER}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_USER_PASS=${MARIADB_USER_PASS}
      - MARIADB_DB=${MARIADB_DB}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
    restart: unless-stopped

  telegrambot:
    build:
      context: ./telegrambot
    image: telegrambot_industrial
    container_name: telegrambot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_NAME=${TELEGRAM_BOT_NAME}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_URL=${API_URL}
    depends_on:
      - apiiot
      - mariadb
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      - PMA_HOST=mariadb
    ports:
      - "8080:80"
    depends_on:
      - mariadb
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    user: "1000"
    volumes:
      - ./grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - mariadb
    environment:
      - GF_SERVER_PROTOCOL=http
      - GF_ANALYTICS_REPORTING_ENABLED=false
    restart: unless-stopped

  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - URL=${DOMINIO}
      - VALIDATION=dns
      - DNSPLUGIN=duckdns
      - DUCKDNSTOKEN=${DUCKDNSTOKEN}
    volumes:
      - ./swag:/config
    ports:
      - "${PUERTO}:443"
      - "80:80"
    restart: unless-stopped